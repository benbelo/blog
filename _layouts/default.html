<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<script>
  // Applique le thème avant le premier rendu, pour éviter tout flash.
  (function () {
    try {
      var t = localStorage.getItem('theme');
      // Clair par défaut : on ne suit pas le réglage système, seul le bouton décide.
      if (t !== 'dark') { t = 'light'; }
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
<header>
  <div class="wrapper">
    <h1><a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
    <nav>
      <a href="{{ '/' | relative_url }}">articles</a>
      <a href="https://benjaminbelot.fr/">à propos</a>
      <a href="{{ '/feed.xml' | relative_url }}">rss</a>
      <button class="theme-toggle" type="button" aria-pressed="false"
              aria-label="Basculer le thème clair ou sombre" title="Thème clair / sombre">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
        </svg>
      </button>
    </nav>
  </div>
</header>
<main>
<div class="wrapper">
{{ content }}
</div>
</main>
<footer>
<div class="wrapper">© {{ site.time | date: "%Y" }} {{ site.title }}</div>
</footer>
<script src="{{ '/assets/theme.js' | relative_url }}" defer></script>
</body>
</html>
