---
layout: default
---
<ul class="posts">
{% for post in site.posts %}
  <li><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%d/%m/%Y" }}</time><a href="{{ post.url | relative_url }}">{{ post.title }}</a></li>
{% else %}
  <li>Aucun article pour l'instant.</li>
{% endfor %}
</ul>
